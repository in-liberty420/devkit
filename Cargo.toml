[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
async-trait = "0.1.89"
thiserror = "2.0.12"
ulid = "1.2.1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
